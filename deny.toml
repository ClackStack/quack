# cargo-deny: licences, advisories, bans, sources. Run: cargo deny check
[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
    { id = "RUSTSEC-2024-0370", reason = "proc-macro-error via gtk 0.18 / glib 0.18 (tauri/wry/tao Linux deps); compile-time proc-macro only, no upgrade until Tauri drops gtk3" },
    { id = "RUSTSEC-2026-0370", reason = "zvariant 5 via zbus 5 required by tauri-plugin-{notification,opener,single-instance}; no upstream zbus 6 release yet" },
    { id = "RUSTSEC-2026-0543", reason = "chrono via rmcp 3.9.0 (pinned for MCP 2026-07-28 support); unmaintained but not a vulnerability; drop when rmcp migrates to jiff/time" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names 4 via zbus 5 required by tauri-plugin-{notification,opener,single-instance}; tauri plugins not yet on zbus 6 (notify-rust already is)" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive 5 via zbus 5 required by tauri-plugin-{notification,opener,single-instance}; compile-time proc-macro, tauri plugins not yet on zbus 6 (notify-rust already is)" },
]

[licenses]
version = 2
confidence-threshold = 0.9
# Apache-2.0-compatible licences only (docs/plan/00-architecture.md#key-dependencies-initial-picks).
# MPL-2.0 is file-level weak copyleft: unmodified crates in an Apache-2.0 binary are permitted
# as a Larger Work when notices and source availability for MPL-2.0 files are preserved.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
    "MPL-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
