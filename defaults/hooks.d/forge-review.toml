[setup]
version = 1
scope_field = "web_url"

[[setup.fields]]
id = "label"
label = "Connection name"
kind = "text"
required = true
default = "My connection"
help = "A name you will recognize in the connection list."

[[setup.fields]]
id = "web_url"
label = "Server URL"
kind = "url"
required = true
credential_scope = true
help = "The web address, including an installation prefix if used. Enter the server base, not a review URL."

[[setup.fields]]
id = "auth"
label = "Authentication"
kind = "choice"
required = true
default = "public"
choices = ["public", "token", "basic"]
help = "Use left/right to choose public access, token, or email and API token (basic)."

[[setup.fields]]
id = "token"
label = "Access token"
kind = "secret"
help = "Paste your token here. It stays masked. Empty keeps the saved credential."
[setup.fields.required_when]
auth = ["token", "basic"]

[[setup.fields]]
id = "user"
label = "Account email"
kind = "text"
help = "Required for Basic authentication, such as an Atlassian API token."
[setup.fields.required_when]
auth = ["basic"]

[[setup.fields]]
id = "api_url"
label = "API base URL"
kind = "url"
required = true
advanced = true
credential_scope = true
help = "Requests and credentials go only to this API origin. Check this address before saving."

[[setup.fields]]
id = "ca_bundle"
label = "Extra CA certificate file"
kind = "text"
advanced = true
help = "Optional PEM file added to the system trust store. A leading ~/ is supported."

[[setup.fields]]
id = "proxy"
label = "HTTP proxy URL"
kind = "url"
advanced = true
help = "Optional proxy without embedded credentials. Empty uses the inherited proxy environment."

[[setup.fields]]
id = "timeout"
label = "Request timeout (seconds)"
kind = "integer"
default = "5"
advanced = true
help = "Timeout for each REST request. The hook also has an overall timeout."

[[setup.presets]]
id = "github"
label = "GitHub"
help = "Read access to the selected repository is required. Token help: https://docs.github.com/en/authentication/keeping-your-account-and-data-secure/managing-your-personal-access-tokens"
[setup.presets.values]
kind = "github"
web_url = "https://github.com"
api_url = "https://api.github.com"
auth = "public"
[setup.presets.choices]
auth = ["public", "token"]

[[setup.presets]]
id = "github-enterprise"
label = "GitHub Enterprise"
help = "Use your GitHub Enterprise web address. Authorize organization access when required."
[setup.presets.values]
kind = "github"
web_url = ""
api_url = ""
auth = "public"
[setup.presets.choices]
auth = ["public", "token"]
[setup.presets.derived]
api_url = "{web_url}/api/v3"

[[setup.presets]]
id = "gitlab"
label = "GitLab (cloud or self-hosted)"
help = "Token scope: read_api. Help: https://docs.gitlab.com/user/profile/personal_access_tokens/"
[setup.presets.values]
kind = "gitlab"
web_url = "https://gitlab.com"
api_url = ""
auth = "public"
[setup.presets.choices]
auth = ["public", "token"]
[setup.presets.derived]
api_url = "{web_url}/api/v4"

[[setup.presets]]
id = "gitea"
label = "Gitea (cloud or self-hosted)"
help = "Use a token with repository read access. Help: https://docs.gitea.com/development/api-usage"
[setup.presets.values]
kind = "gitea"
web_url = "https://gitea.com"
api_url = ""
auth = "public"
[setup.presets.choices]
auth = ["public", "token"]
[setup.presets.derived]
api_url = "{web_url}/api/v1"

[[setup.presets]]
id = "forgejo"
label = "Forgejo (cloud or self-hosted)"
help = "Use a token with repository read access. Help: https://forgejo.org/docs/latest/user/api-usage/"
[setup.presets.values]
kind = "gitea"
web_url = "https://codeberg.org"
api_url = ""
auth = "public"
[setup.presets.choices]
auth = ["public", "token"]
[setup.presets.derived]
api_url = "{web_url}/api/v1"

[[setup.presets]]
id = "bitbucket"
label = "Bitbucket Cloud"
help = "API tokens: select basic and enter your Atlassian email. Access tokens: select token. Help: https://support.atlassian.com/bitbucket-cloud/docs/using-api-tokens/"
[setup.presets.values]
kind = "bitbucket"
web_url = "https://bitbucket.org"
api_url = "https://api.bitbucket.org/2.0"
auth = "public"
[setup.presets.choices]
auth = ["public", "basic", "token"]

[[setup.presets]]
id = "bitbucket-server"
label = "Bitbucket Data Center"
help = "Enter your self-hosted Bitbucket web address and a token with repository read access."
[setup.presets.values]
kind = "bitbucket-server"
web_url = ""
api_url = ""
auth = "public"
[setup.presets.choices]
auth = ["public", "token"]
[setup.presets.derived]
api_url = "{web_url}/rest/api/latest"
