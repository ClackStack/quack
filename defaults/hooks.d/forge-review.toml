#:schema ../schemas/hook.json
enabled = false
description = "Pull and merge requests linked in the prompt"
event = "user_prompt"
match = { prompt = 'https?://[^\s<>"`]+/(?:pull|pulls|pull-requests|merge_requests)/[0-9][^\s<>"`]*' }
command = ["{python}", "{dir}/forge-review/review.py"]
timeout_secs = 25
full_context = true
on_error = "warn"

[[connections]]
[connections.connection]
id = "github"
preset = "github"
enabled = true
[connections.connection.values]
label = "GitHub"
kind = "github"
web_url = "https://github.com"
api_url = "https://api.github.com"
auth = "public"
user = ""
ca_bundle = ""
proxy = ""
timeout = "5"

[[connections]]
[connections.connection]
id = "gitlab"
preset = "gitlab"
enabled = true
[connections.connection.values]
label = "GitLab (cloud or self-hosted)"
kind = "gitlab"
web_url = "https://gitlab.com"
api_url = "https://gitlab.com/api/v4"
auth = "public"
user = ""
ca_bundle = ""
proxy = ""
timeout = "5"

[[connections]]
[connections.connection]
id = "gitea"
preset = "gitea"
enabled = true
[connections.connection.values]
label = "Gitea (cloud or self-hosted)"
kind = "gitea"
web_url = "https://gitea.com"
api_url = "https://gitea.com/api/v1"
auth = "public"
user = ""
ca_bundle = ""
proxy = ""
timeout = "5"

[[connections]]
[connections.connection]
