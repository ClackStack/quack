#:schema ../schemas/provider.json
# OpenRouter: many open models behind one key.
# Not contacted until OPENROUTER_API_KEY is set or `quack setup` stores a key.
name = "OpenRouter"
group = "Open-model services"
base_url = "https://openrouter.ai/api/v1"
api_key = { env = "OPENROUTER_API_KEY" }

# Sticky routing activates immediately from the first request when `x-session-id` is sent;
# without it OpenRouter waits for a cache hit before pinning an upstream provider. Kept in
# the header (not body `prompt_cache_key`) so non-OpenAI upstream endpoints never reject it.
[prompt_cache]
affinity_header = "x-session-id"

# Prices: US dollars per million tokens. The rest of the catalog also arrives
# through /models discovery; entries here pin context limits and the prices
# quack costs evals with (DeepSeek's is the peak weekday rate; OpenRouter
# halves it on weekends and off-peak UTC hours). Thinking levels follow what
# OpenRouter accepts per model, and each `effort` is the model maker's default;
# Mistral's own none/high mapping does not apply on this route.

[[models]]
id = "z-ai/glm-5.3-flash"
context_window = 1048576
max_output = 943718
vision = true
reasoning = { effort = "max", efforts = ["low", "high", "max"] }
cost = { input = 0.15, output = 0.5, cached_input = 0.03 }

[[models]]
id = "deepseek/deepseek-v4.1-flash-1017"
context_window = 1048576
max_output = 393216
vision = true
reasoning = { effort = "high", efforts = ["none", "low", "high", "max"] }
cost = { input = 0.036, output = 0.5, cached_input = 0.01 }

[[models]]
id = "mistralai/mistral-large-4-0"
context_window = 1048576
max_output = 262144
vision = true
reasoning = { efforts = ["low", "medium", "high"] }
cost = { input = 0.7, output = 2.1, cached_input = 0.07 }

# Muse Spark's model card recommends temperature 1.0, top_p 1.0, top_k off,
# reasoning effort high or xhigh (the server default) for coding and agents.
[[models]]
id = "meta/muse-spark-open"
context_window = 1048576
max_output = 943718
sampling = { temperature = 1.0, top_p = 1.0 }
reasoning = { effort = "xhigh", efforts = ["low", "medium", "high", "xhigh"] }
cost = { input = 1.25, output = 4.25, cached_input = 0.15 }
