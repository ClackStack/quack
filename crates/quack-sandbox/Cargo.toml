[package]
name = "quack-sandbox"
description = "OS sandboxing: Landlock + seccomp on Linux, Seatbelt on macOS, Restricted Token on Windows"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
tokio = { workspace = true, features = ["process", "fs", "io-util", "rt"] }
tracing.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
# Already in the tree (through nix, tokio and others).
libc = "0.2.191"

[target.'cfg(target_os = "windows")'.dependencies]
# Already in the tree (through quack-shell and tokio).
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_StationsAndDesktops",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "io-util", "net"] }

[lints]
workspace = true
